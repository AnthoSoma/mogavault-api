spring:
  application:
    name: mogavault-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mogavault}
    username: ${DB_USER:mogavault_user}
    password: ${DB_PASSWORD:mogavault_secure_password_123!}
    driver-class-name: org.postgresql.Driver
    jpa:
      hibernate:
        ddl-auto: validate
      show-sql: true
      properties:
        hibernate:
          format_sql: true
    flyway:
      enabled: true
      baseline-on-migrate: true
      locations: classpath:db/migration

server:
  port: 8080
